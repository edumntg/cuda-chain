name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64, ext: "" }
          - { os: macos-14, target: aarch64-apple-darwin, name: darwin-arm64, ext: "" }
          - { os: macos-13, target: x86_64-apple-darwin, name: darwin-x86_64, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p plasmon-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/plasmon${{ matrix.ext }} dist/plasmon-${{ matrix.name }}${{ matrix.ext }}
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum plasmon-${{ matrix.name }}${{ matrix.ext }} > plasmon-${{ matrix.name }}${{ matrix.ext }}.sha256; else shasum -a 256 plasmon-${{ matrix.name }}${{ matrix.ext }} > plasmon-${{ matrix.name }}${{ matrix.ext }}.sha256; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plasmon-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: manifest
        run: |
          cd dist
          python3 - <<'PY'
          import json, os
          out = {"version": os.environ["GITHUB_REF_NAME"], "files": {}}
          for f in sorted(os.listdir(".")):
              if f.endswith(".sha256"):
                  digest = open(f).read().split()[0]
                  out["files"][f[:-7]] = {"sha256": digest}
          json.dump(out, open("manifest.json", "w"), indent=1)
          PY
          cat manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
