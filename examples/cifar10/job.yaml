# CIFAR-10, 50,000 colour images in 10 classes, a 0.8M-parameter CNN. Takes minutes, not
# seconds: a good first job for two or more machines. Data: 163 MB, downloaded once.
name: cifar10-cnn
model:
  arch: cifar_cnn
  config: {width: 32}
dataset:
  source: builtin://cifar10
  shard_size: 2500
recipe:
  algorithm: diloco
  inner_steps: 100
  batch_size: 64
  inner_optimizer: {name: adamw, lr: 1.0e-3, weight_decay: 0.05}
  outer_optimizer: {name: nesterov, lr: 0.7, momentum: 0.9}
  compression: {name: topk, topk: 0.1, error_feedback: true}
requirements:
  device: any
  min_trainers: 1
  max_trainers: 8
  round_timeout_s: 900
budget:
  rounds: 30
