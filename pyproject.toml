[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plasmon"
version = "0.1.0"
description = "Train models on a fleet of volunteer GPUs. Engine: coordinator, trainer, validator."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Eduardo Montilva" }]
dependencies = [
  "blake3>=1.0",
  "cryptography>=43",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
engine = [
  "torch>=2.3",
  "safetensors>=0.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "psutil>=5.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23",
  "itsdangerous>=2.2",
  "nvidia-ml-py>=12",
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
  "joserfc>=1.0",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "moto[s3]>=5",
]

[project.urls]
Homepage = "https://github.com/edumntg/plasmon"

[tool.hatch.build.targets.wheel]
packages = ["python/plasmon"]

[tool.hatch.build.targets.sdist]
include = ["python/plasmon", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
