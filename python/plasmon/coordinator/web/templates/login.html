{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth">
  <h1>Log in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if sso %}<p><a class="button" href="/auth/oidc/login?next={{ next }}">Log in with single sign-on</a></p><p class="muted small">Or with a local account:</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input name="email" type="email" required autocomplete="username" autofocus></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
  {% if open_registration %}<p class="muted">No account yet? <a href="/register">Create one</a>.</p>{% endif %}
</section>
{% endblock %}
